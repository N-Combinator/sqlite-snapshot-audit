[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-snapshot-audit"
version = "0.1.0"
description = "Read-only SQLite backup-family consistency auditor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sqlite-snapshot-audit = "sqlite_snapshot_audit.cli:main"

[project.urls]
Homepage = "https://github.com/N-Combinator/sqlite-snapshot-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
